lock_dwell_frames = 6
; safety margin for the first steps, when the real px-per-count is still
; unknown. 5.0 means "assume the config could be 5x wrong". Do not set below
; 1.5 or the very first jump may over-shoot. Any value >= 1.5 is safe.
lock_sens_guard = 5.0

; ---- high-rate aim loop -------------------------------------------------
; The AI model runs at ~34 FPS (29 ms), so waiting for the next detection
; would make the crosshair lag behind. A separate aim thread corrects the
; crosshair every `mouse_aim_tick_ms` instead (4 ms = 250 Hz). Lower = more
; responsive, but below ~2 ms it only burns CPU, the mouse itself cannot
; report faster.
mouse_aim_tick_ms = 4
; 0 = release the moment the detection disappears (required if you want the
; crosshair to let go instantly). A value > 0 keeps the last goal alive for
; that many ms when the model misses a frame, which is only useful when your
; detector drops frames on a visible enemy.
mouse_release_ms = 0
; extra delay between detection and the first movement, 0 = none
mouse_reaction_delay_ms = 0

; ---- distance (depth) compensation --------------------------------------
; A target twice as far needs twice the counts for the same pixel distance.
; 0 = learn the reference automatically from the running average head height
; (recommended). If you want it exact, set the head height in detection
; pixels at the distance you tuned `mouse_sensitivity` at, e.g. 60.
depth_ref_height_px = 0
; only used when depth_ref_height_px = 0; 0 = take it from mouse_fov_width
depth_fov_deg = 0

; ---- motion prediction ---------------------------------------------------
; Aim ahead of a moving target by this many ms (0 = aim at where it is now).
; 25-40 helps against sprinting enemies, above ~60 it starts missing strafers.
predict_lookahead_ms = 0

